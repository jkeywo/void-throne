name: Check game and player build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check game rules and multiplayer authority
        run: |
          python -m unittest discover -s tests -p test_game.py -v
          python -m unittest discover -s tests -p test_multiplayer.py -v
          python -m unittest discover -s tests -p test_browser_host.py -v
          python -m unittest discover -s tests -p test_faction_foresight.py -v
          python -m unittest discover -s tests -p test_player_information.py -v
          python -m unittest discover -s tests -p test_orders_v04.py -v
          python -m unittest discover -s tests -p test_asset_traits.py -v
          python -m unittest discover -s tests -p test_opening_rounds.py -v
          python -m unittest discover -s tests -p test_other_orders.py -v
      - name: Build the online game
        run: python tools/build_pages.py
